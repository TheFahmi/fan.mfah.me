<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stand Fan 3D</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { overflow:hidden; font-family:'Segoe UI',sans-serif; background:#e9ecf2; }
#stage { position:fixed; inset:0; }
.hud {
  position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
  display:flex; flex-direction:column; align-items:center; gap:12px; z-index:10;
}
.controls { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
button {
  padding:11px 20px; font-size:14px; font-weight:600; border:none; border-radius:9px;
  cursor:pointer; transition:all .2s; min-width:64px; color:#101a30;
  background:linear-gradient(135deg,#f0a63a,#e08714);
  box-shadow:0 4px 14px rgba(0,0,0,.4);
}
button:hover { transform:translateY(-2px); }
button.active { background:linear-gradient(135deg,#3fae6a,#2b8a53); color:#fff; }
#btn-off  { background:linear-gradient(135deg,#667399,#414d70); color:#fff; }
#btn-off.active { background:linear-gradient(135deg,#3fae6a,#2b8a53); }
#btn-osc  { background:linear-gradient(135deg,#8a63d2,#6a43b8); color:#fff; }
#btn-osc.active { background:linear-gradient(135deg,#3fae6a,#2b8a53); }
.status {
  color:#dfe4f5; font-size:15px; font-weight:600; letter-spacing:.4px;
  padding:8px 20px; background:rgba(255,255,255,.08); border-radius:9px;
  backdrop-filter:blur(6px);
}
.height-row {
  display:flex; align-items:center; gap:10px;
  color:#dfe4f5; font-size:13px; font-weight:600;
}
.height-row input { width:180px; accent-color:#f0a63a; cursor:pointer; }
</style>
</head>
<body>
<div id="stage"></div>
<div class="hud">
  <div class="controls">
    <button id="btn-off" class="active">OFF</button>
    <button id="btn-1">1</button>
    <button id="btn-2">2</button>
    <button id="btn-3">3</button>
    <button id="btn-osc">Oscillate</button>
  </div>
  <div class="height-row">
    <span class="hlabel">Height</span>
    <input type="range" id="height" min="0" max="1" step="0.01" value="0.75">
  </div>
  <div class="status" id="status">OFF</div>
</div>

<script src="/three.min.js"></script>
<script>
const stage = document.getElementById('stage');
const statusEl = document.getElementById('status');

/* ===== RENDERER / SCENE / CAMERA ===== */
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe9ecf2);
scene.fog = new THREE.Fog(0xe9ecf2, 22, 40);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);

/* Orbit camera: drag to rotate, wheel to zoom */
const orbit = { yaw: 0, pitch: 0.33, dist: 16, target: new THREE.Vector3(0, 4.2, 0) };
function applyCamera() {
  camera.position.set(
    orbit.target.x + orbit.dist * Math.cos(orbit.pitch) * Math.sin(orbit.yaw),
    orbit.target.y + orbit.dist * Math.sin(orbit.pitch),
    orbit.target.z + orbit.dist * Math.cos(orbit.pitch) * Math.cos(orbit.yaw)
  );
  camera.lookAt(orbit.target);
}
applyCamera();

let dragging = false, lastX = 0, lastY = 0;
renderer.domElement.style.cursor = 'grab';
renderer.domElement.addEventListener('pointerdown', e => {
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  renderer.domElement.style.cursor = 'grabbing';
  renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener('pointermove', e => {
  if (!dragging) return;
  orbit.yaw   -= (e.clientX - lastX) * 0.008;
  orbit.pitch  = Math.min(1.3, Math.max(-0.25, orbit.pitch + (e.clientY - lastY) * 0.005));
  lastX = e.clientX; lastY = e.clientY;
  applyCamera();
});
renderer.domElement.addEventListener('pointerup', e => {
  dragging = false;
  renderer.domElement.style.cursor = 'grab';
  renderer.domElement.releasePointerCapture(e.pointerId);
});
renderer.domElement.addEventListener('wheel', e => {
  e.preventDefault();
  orbit.dist = Math.min(28, Math.max(7, orbit.dist + e.deltaY * 0.012));
  applyCamera();
}, { passive:false });

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ===== LIGHTS ===== */
scene.add(new THREE.HemisphereLight(0xffffff, 0xb8bec9, 0.75));
const key = new THREE.DirectionalLight(0xffffff, 0.95);
key.position.set(6, 10, 8);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -8; key.shadow.camera.right = 8;
key.shadow.camera.top = 12;  key.shadow.camera.bottom = -2;
scene.add(key);
const rim = new THREE.DirectionalLight(0x8fa0ff, 0.5);
rim.position.set(-7, 6, -6);
scene.add(rim);

/* ===== MATERIALS ===== */
const matBody  = new THREE.MeshStandardMaterial({ color:0x3d7ea8, metalness:.55, roughness:.4 });
const matLight = new THREE.MeshStandardMaterial({ color:0xd7dee6, metalness:.6,  roughness:.3 });
const matDark  = new THREE.MeshStandardMaterial({ color:0x2b3a4a, metalness:.5,  roughness:.5 });
const matBlade = new THREE.MeshStandardMaterial({ color:0x5fa8d3, metalness:.45, roughness:.35, side:THREE.DoubleSide });
const matGuard = new THREE.MeshStandardMaterial({ color:0x33566e, metalness:.65, roughness:.4 });

/* ===== FLOOR ===== */
const floor = new THREE.Mesh(
  new THREE.CircleGeometry(14, 48),
  new THREE.MeshStandardMaterial({ color:0xf2f4f8, metalness:.05, roughness:.98 })
);
floor.rotation.x = -Math.PI/2;
floor.receiveShadow = true;
scene.add(floor);

/* ===== FAN ===== */
const fan = new THREE.Group(); // whole fan (base + neck + head pivot)
scene.add(fan);
const NECK_Z = -0.55;            // neck axis: centered on dinamo

/* Base */
const base = new THREE.Mesh(new THREE.CylinderGeometry(2.3, 2.55, 0.42, 48), matBody);
base.position.y = 0.21;
base.castShadow = base.receiveShadow = true;
fan.add(base);
const baseCap = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.8, 0.35, 32), matLight);
baseCap.position.set(0, 0.52, NECK_Z);   // silver socket — pole enters this
baseCap.castShadow = true;
fan.add(baseCap);

/* Neck: inner pole (telescopes into sleeve) — centered on dinamo axis */
const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.17, 2.4, 24), matBody);
neck.castShadow = true;
fan.add(neck);
const neckRing = new THREE.Mesh(new THREE.TorusGeometry(0.24, 0.06, 12, 28), matLight);
neckRing.rotation.x = Math.PI/2;
neckRing.position.set(0, 0.55, NECK_Z);
fan.add(neckRing);

/* Outer sleeve (fixed) + collar */
const sleeve = new THREE.Mesh(new THREE.CylinderGeometry(0.23, 0.25, 1.3, 24), matBody);
sleeve.position.set(0, 0.85, NECK_Z);
sleeve.castShadow = true;
fan.add(sleeve);
const collar = new THREE.Mesh(new THREE.CylinderGeometry(0.29, 0.29, 0.5, 24), matDark);
collar.position.set(0, 1.35, NECK_Z);
collar.castShadow = true;
fan.add(collar);

/* ===== HEAD — pivot axis = neck axis (behind dinamo), height-adjustable ===== */
const headPivot = new THREE.Group();
headPivot.position.set(0, 3.6, NECK_Z);
fan.add(headPivot);

/* Neck-to-motor joint knob */
const joint = new THREE.Mesh(new THREE.SphereGeometry(0.34, 24, 16), matDark);
joint.castShadow = true;
headPivot.add(joint);

/* head content shifted forward so blade plane stays at z≈0 */
const head = new THREE.Group();
head.position.z = -NECK_Z;
head.rotation.x = -0.06;
headPivot.add(head);

/* Motor housing (dinamo, short) — head-local: stops before back guard */
const motor = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.58, 0.95, 32), matBody);
motor.rotation.x = Math.PI/2;
motor.position.z = -0.55;
motor.castShadow = true;
head.add(motor);
const motorCap = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.46, 0.3, 32), matDark);
motorCap.rotation.x = Math.PI/2;
motorCap.position.z = -1.0;
head.add(motorCap);

/* Hub */
const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.46, 0.3, 32), matLight);
hub.rotation.x = Math.PI/2;
hub.position.z = 0.08;
hub.castShadow = true;
head.add(hub);
const hubCap = new THREE.Mesh(new THREE.SphereGeometry(0.2, 24, 16), matDark);
hubCap.position.z = 0.26;
head.add(hubCap);

/* Front guard center logo disc */
const logoCanvas = document.createElement('canvas');
logoCanvas.width = logoCanvas.height = 256;
const lctx = logoCanvas.getContext('2d');
lctx.fillStyle = '#1e63a4'; lctx.beginPath(); lctx.arc(128,128,128,0,Math.PI*2); lctx.fill();
lctx.strokeStyle = '#ffffff'; lctx.lineWidth = 10;
lctx.beginPath(); lctx.arc(128,128,100,0,Math.PI*2); lctx.stroke();
lctx.fillStyle = '#ffffff';
lctx.font = 'bold 120px Segoe UI, Arial'; lctx.textAlign = 'center'; lctx.textBaseline = 'middle';
lctx.fillText('F', 128, 134);
const logo = new THREE.Mesh(
  new THREE.CircleGeometry(0.5, 32),
  new THREE.MeshStandardMaterial({ map: new THREE.CanvasTexture(logoCanvas), metalness:.3, roughness:.5 })
);
logo.position.z = 0.85;              // OUTSIDE the front guard (guard plane 0.70)
head.add(logo);

/* ===== BLADES ===== */
const bladeShape = new THREE.Shape();
bladeShape.moveTo(0.15, 0.16);
bladeShape.bezierCurveTo(0.55, 0.5, 1.5, 0.52, 1.95, 0.18);
bladeShape.bezierCurveTo(2.25, -0.05, 2.1, -0.5, 1.5, -0.55);
bladeShape.bezierCurveTo(0.85, -0.6, 0.3, -0.3, 0.15, 0.16);
const bladeGeo = new THREE.ExtrudeGeometry(bladeShape, {
  depth:0.035, bevelEnabled:true, bevelThickness:0.015, bevelSize:0.02, bevelSegments:2
});
bladeGeo.center ? null : null;

const blades = new THREE.Group();
head.add(blades);
for (let i = 0; i < 3; i++) {
  const arm = new THREE.Group();
  const blade = new THREE.Mesh(bladeGeo, matBlade);
  blade.rotation.y = -0.26;                // 15° pitch, blows forward — tip z ≈ 0.49 < front guard 0.70
  blade.scale.setScalar(0.85);             // tip radius 1.91 < guard 2.1
  blade.castShadow = true;
  arm.add(blade);
  arm.rotation.z = i * (Math.PI*2/3);
  blades.add(arm);
}

/* ===== GUARD (front rings + spokes, back ring) ===== */
const guard = new THREE.Group();
head.add(guard);

function ring(radius, tube, z, mat) {
  const m = new THREE.Mesh(new THREE.TorusGeometry(radius, tube, 14, 64), mat || matGuard);
  m.position.z = z;
  m.castShadow = true;
  guard.add(m);
}
ring(2.1, 0.05, 0.70);
ring(1.62, 0.028, 0.70);
ring(1.14, 0.026, 0.70);
ring(0.68, 0.024, 0.70);
/* back guard: rings + spokes */
ring(2.1, 0.05, -0.30);
ring(1.4, 0.03, -0.30);
ring(0.7, 0.028, -0.30);
for (let i = 0; i < 12; i++) {
  const a = i * Math.PI/6;
  const sp = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 2.05, 8), matGuard);
  sp.position.set(Math.sin(a)*1.025, Math.cos(a)*1.025, -0.30);
  sp.rotation.z = a + Math.PI/2;
  guard.add(sp);
}

for (let i = 0; i < 16; i++) {
  const sp = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 2.05, 8), matGuard);
  sp.position.set(Math.sin(i*Math.PI/8)*1.025, Math.cos(i*Math.PI/8)*1.025, 0.70);
  sp.rotation.z = i*Math.PI/8 + Math.PI/2;
  guard.add(sp);
}
/* guard rim connector */
const rimConn = new THREE.Mesh(new THREE.TorusGeometry(2.1, 0.028, 12, 64), matLight);
rimConn.position.z = 0.02;
guard.add(rimConn);

/* perimeter bars connecting front & back guard */
const connLen = 1.0;                                   // 0.70 → -0.30
for (let i = 0; i < 14; i++) {
  const a = i * Math.PI*2/14;
  const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.024, 0.024, connLen, 8), matGuard);
  bar.rotation.x = Math.PI/2;
  bar.position.set(Math.sin(a)*2.1, Math.cos(a)*2.1, 0.20);
  bar.castShadow = true;
  guard.add(bar);
}

/* ===== STATE ===== */
let speed = 0, osc = false, spin = 0, swayT = 0;
const SPEEDS = { 1: 9, 2: 16, 3: 26 };   // rad/s
const HEAD_MIN = 3.1, HEAD_MAX = 5.3;    // headPivot height range
const POLE_BASE = 1.2;                   // inner pole bottom offset from pivot

/* Height slider */
const heightSlider = document.getElementById('height');
function setHeight(t) {
  const h = HEAD_MIN + (HEAD_MAX - HEAD_MIN) * t;
  headPivot.position.y = h;
  /* inner pole: from inside silver base socket up to joint — pole enters the silver cap */
  const poleBottom = 0.3;                       // inside baseCap socket
  const poleTop = h;                            // joint height
  const len = poleTop - poleBottom;
  neck.geometry.dispose();
  neck.geometry = new THREE.CylinderGeometry(0.17, 0.17, len, 24);
  neck.position.set(0, poleBottom + len/2, NECK_Z);  // z: behind motor!
}
heightSlider.addEventListener('input', () => setHeight(parseFloat(heightSlider.value)));
setHeight(parseFloat(heightSlider.value));

/* ===== CONTROLS ===== */
const btns = document.querySelectorAll('button');
function apply() {
  btns.forEach(b => b.classList.remove('active'));
  if (osc) document.getElementById('btn-osc').classList.add('active');
  if (speed === 0) document.getElementById('btn-off').classList.add('active');
  else document.getElementById('btn-' + speed).classList.add('active');
  statusEl.textContent = speed === 0
    ? (osc ? 'OFF · oscillating' : 'OFF')
    : 'Speed ' + speed + (osc ? ' · oscillating' : '');
}
document.getElementById('btn-off').onclick = () => { speed = 0; apply(); };
[1,2,3].forEach(n => document.getElementById('btn-'+n).onclick = () => { speed = n; apply(); });
document.getElementById('btn-osc').onclick = () => { osc = !osc; apply(); };

/* ===== LOOP ===== */
const clock = new THREE.Clock();
function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (speed > 0) spin -= SPEEDS[speed] * dt;
  blades.rotation.z = spin;

  if (osc) { swayT += dt * 1.4; headPivot.rotation.y = Math.sin(swayT) * 0.72; }

  renderer.render(scene, camera);
}
tick();
</script>
</body>
</html>
